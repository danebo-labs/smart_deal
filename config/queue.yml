default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Default lane: TrackBedrockQueryJob (metrics footer), TrackIngestionUsageJob,
    # KbDocumentEnrichmentJob, UploadAndSyncAttachmentsJob, etc.
    # 1s polling = ~4 SELECTs/s on RDS in idle. Footer updates ~1s after a query
    # response, which is acceptable for a non-critical cost metric (the model
    # answer arrives several seconds before the footer either way).
    # solid_queue_recurring belongs here: a recurring task declared with
    # `command:` instead of `class:` (clear_solid_queue_finished_jobs) is wrapped
    # in SolidQueue::RecurringJob and enqueued on that queue. With no worker
    # consuming it the hourly cleanup never ran once, so finished jobs were never
    # cleared and 553 of its own enqueues piled up between May and August.
    - queues: [ default, solid_queue_recurring ]
      threads: 4
      processes: 1
      polling_interval: 1

    # Dedicated ingestion lane: BedrockIngestionJob can spend 1–15 min waiting
    # for Bedrock to finish indexing. Isolated so that two concurrent uploads
    # never starve the default lane jobs.
    - queues: ingestion
      threads: 1
      processes: 1
      polling_interval: 2

    # Bulk ingestion lane: ProcessBulkUploadJob, SubmitClaudeBatchJob,
    # PollClaudeBatchJob, IngestBatchResultsJob, PollBulkBedrockIngestionJob.
    # Poll jobs use re-enqueue pattern (one check per perform + wait) so thread
    # utilisation is low; 2 threads cover concurrent bulk uploads on the MVP pilot.
    - queues: bulk_ingestion
      threads: 2
      processes: 1
      polling_interval: 2

    # Transcription lane (Fase 5): TranscriptionJob polls the STT provider
    # inside the job (10–60 s per dictation with Transcribe, ~5 s with OpenAI).
    # Isolated from `default` so certifiers dictating never delay the chat's
    # cost footer or photo analysis; 2 threads = at most 2 billed calls in
    # flight, enough for one short dictation per finding.
    - queues: transcription
      threads: 2
      processes: 1
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default