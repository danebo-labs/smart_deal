# Fase 6 STT benchmark corpus.
# The 20 technical phrases are the scoring sheet for the founder — the runner
# does not count errors. Five inspection-style dictations put those phrases in
# context. Silence / noise / low-voice are quality probes from the Fase 5
# closure (Whisper hallucination on empty audio).
version: "2026-09-08"
voice: Paulina
sample_rate: 16000

phrases:
  - id: p01
    text: la puerta de cabina roza en el marco
  - id: p02
    text: código de falla A32.4
  - id: p03
    text: doce paradas
  - id: p04
    text: norma NCh 2840
  - id: p05
    text: carga útil 450 kilos
  - id: p06
    text: velocidad 1,6 metros por segundo
  - id: p07
    text: embarque tres
  - id: p08
    text: limitador de velocidad
  - id: p09
    text: paracaídas
  - id: p10
    text: operador de puertas
  - id: p11
    text: señalización de sobrecarga
  - id: p12
    text: variador
  - id: p13
    text: foso
  - id: p14
    text: contrapeso
  - id: p15
    text: holgura
  - id: p16
    text: código KM 887
  - id: p17
