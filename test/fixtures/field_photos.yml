# Evidence photo referenced by inspection_findings(:cabina_puerta). Its
# created_at defaults to load time, so it sits inside every retention window and
# only the finding reference keeps it alive (fixed rule 10).
# FieldPhoto has no belongs_to :user, so user_id is set by identifier.
cabina_evidence:
  account: legacy
  user_id: <%= ActiveRecord::FixtureSet.identify(:one) %>
  sha256: <%= "f" * 64 %>
  s3_key_original: field_photos/<%= ActiveRecord::FixtureSet.identify(:legacy) %>/<%= "f" * 64 %>/original.jpg
  content_type: image/jpeg
  byte_size: 20480

# Fase 1B — evidence for inspection_findings(:portales_motor_grave), the one
# "grave" finding fixture, so the review document's evidence section and its
# major-defect table both have real data to render, not just empty states.
portales_motor_evidence:
  account: climb
  user_id: <%= ActiveRecord::FixtureSet.identify(:two) %>
  sha256: <%= "e" * 64 %>
  s3_key_original: field_photos/<%= ActiveRecord::FixtureSet.identify(:climb) %>/<%= "e" * 64 %>/original.jpg
  content_type: image/jpeg
  byte_size: 30720
