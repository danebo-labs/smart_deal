# Canonical Field Companion cases. Literals are Anexo C of
# docs/Plan maestro de implementación — Danebo .md.
# `expect` is the later-phase contract. It is not today's behavior.
- id: T-A
  group: text
  turns:
    - role: user
      content: "Cómo se ajustan los resortes de la fijación de cables ?"
      expect:
        decision: opened
    - role: assistant
      content: "… ¿Qué marca y modelo es el equipo?"
    - role: user
      content: "Fuji Yida"
      expect:
        decision: continued_elliptical
        manufacturer: "Fuji Yida"
    - role: assistant
      content: "… ¿Sabes el modelo?"
    - role: user
      content: "el modelo no lo sé"
      expect:
        decision: continued_elliptical
        model: unknown_confirmed
        composed_parts: [goal, "Fuji Yida", turn]
        menu: false
- id: T-B
  group: text
  turns:
    - role: user
      content: "Elemont MH con placa CEA15, falla en puerta 1: el imán no magnetiza. ¿Qué reviso?"
      expect:
        decision: opened
        manufacturer: Elemont
        identifiers: [MH, CEA15]
    - role: assistant
      content: "… ¿Muestra algún código?"
    - role: user
      content: "código 8"
      expect:
        decision: continued_elliptical
        fault_code: "8"
        composed_contains: [Elemont, MH, CEA15, "puerta 1", "código 8"]
